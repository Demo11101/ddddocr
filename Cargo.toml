[package]
name = "ddddocr"
version = "1.0.0"
edition = "2021"
# Railpack/mise reads this; must be new enough to parse edition2024 crates.
rust-version = "1.89"
description = "ddddocr OCR-only fork (x86_64 Linux)"

[features]
# 默认内联嵌入 common.onnx / common.json
default = ["inline-model", "download-binaries"]

# 编译时是否内联 OCR 模型（开启后二进制无需外置 model/）
inline-model = []

# cuda 支持
cuda = ["ort/cuda"]

# 动态链接
load-dynamic = ["ort/load-dynamic"]

# 自动下载动态链接或静态库，取决于 load-dynamic
download-binaries = ["ort/download-binaries"]

[dependencies]
# 推理与数值计算（无 Windows DML）
ort = { git = "https://github.com/86maid/ort.git", default-features = false, features = [
  "ndarray",
  "half",
  "copy-dylibs",
] }
ndarray = "0.15"

# time >=0.3.46 needs edition2024; pin in case Railway still uses old Cargo.
time = "=0.3.41"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
image = "0.25"
sha256 = "1.6"
base64 = "0.22"

salvo = { version = "0.85", features = [
  "oapi",
  "anyhow",
  "rustls",
  "acme",
  "logging",
] }
salvo_extra = { version = "0.85.0", default-features = false, features = [
  "logging",
] }

tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1.41"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.48", features = ["full"] }
lru = "0.16"
bytes = "1.11"
enable-ansi-support = "0.3"
